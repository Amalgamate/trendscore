name: Fix WASO Admin Phone (One-Shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: Fetch full recent backend logs from WASO (last 200)
        run: |
          set -euo pipefail
          ssh production "sudo docker logs zawadi-waso-cs-backend-1 --tail=200 2>&1 | grep -v '304\|public/branding\|public/manifest\|login-config' | tail -80"
