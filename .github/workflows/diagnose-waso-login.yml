name: Fix WASO Admin Phone (One-Shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: Fix WASO admin phone conflicts
        env:
          COMPOSE_PROJECT: zawadi-waso-cs
        run: |
          set -euo pipefail
          ssh production "
            set -euo pipefail

            CONTAINER=\$(sudo docker ps \
              --filter 'label=com.docker.compose.project=${COMPOSE_PROJECT}' \
              --filter 'label=com.docker.compose.service=backend' \
              --format '{{.Names}}' | head -n1)

            echo \"Container: \${CONTAINER}\"

            sudo docker exec \"\${CONTAINER}\" node -e \"
              const { PrismaClient } = require('@prisma/client');
              const prisma = new PrismaClient();

              async function main() {
                const PHONE_VARIANTS = ['+254713612141', '254713612141', '0713612141', '713612141'];

                // 1. Count before
                const before = await prisma.user.findMany({
                  where: { phone: { in: PHONE_VARIANTS }, archived: false },
                  select: { id: true, email: true, phone: true, role: true }
                });
                console.log('Users with this phone BEFORE fix:', before.length);
                before.forEach(u => console.log(' -', u.role, u.email, u.phone));

                // 2. Clear phone from ALL non-SUPER_ADMIN users who have it
                const cleared = await prisma.user.updateMany({
                  where: {
                    phone: { in: PHONE_VARIANTS },
                    NOT: { role: 'SUPER_ADMIN' }
                  },
                  data: { phone: null }
                });
                console.log('Cleared phone from non-SUPER_ADMIN users:', cleared.count);

                // 3. Set SUPER_ADMIN phone to canonical E164
                const fixed = await prisma.user.updateMany({
                  where: { role: 'SUPER_ADMIN', email: 'admin@trendscore.app' },
                  data: { phone: '+254713612141' }
                });
                console.log('Set SUPER_ADMIN phone to +254713612141, count:', fixed.count);

                // 4. Verify
                const after = await prisma.user.findMany({
                  where: { phone: { in: PHONE_VARIANTS } },
                  select: { id: true, email: true, phone: true, role: true }
                });
                console.log('Users with this phone AFTER fix:', after.length);
                after.forEach(u => console.log(' -', u.role, u.email, u.phone));

                await prisma.\\\$disconnect();
              }

              main().catch(e => { console.error(e); process.exit(1); });
            \"
          "
