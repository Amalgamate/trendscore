name: Fix WASO Admin Phone (One-Shot)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: Leave only WASO-COMPREHENSIVE SCHOOL active and locked
        env:
          COMPOSE_PROJECT: zawadi-waso-cs
        run: |
          set -euo pipefail
          ssh production "
            set -euo pipefail

            CONTAINER=\$(sudo docker ps \
              --filter 'label=com.docker.compose.project=${COMPOSE_PROJECT}' \
              --filter 'label=com.docker.compose.service=backend' \
              --format '{{.Names}}' | head -n1)

            echo \"Container: \${CONTAINER}\"

            sudo docker exec \"\${CONTAINER}\" node -e \"
              const { PrismaClient } = require('@prisma/client');
              const prisma = new PrismaClient();

              async function main() {
                const schools = await prisma.school.findMany({
                  orderBy: { createdAt: 'asc' },
                  select: { id: true, name: true, active: true, archived: true, institutionType: true, institutionTypeLocked: true }
                });
                console.log('Schools before fix:');
                schools.forEach(s => console.log(' -', JSON.stringify(s)));

                // The real school
                const real = schools.find(s => s.name === 'WASO-COMPREHENSIVE SCHOOL');
                if (!real) { console.log('ERROR: WASO-COMPREHENSIVE SCHOOL not found!'); process.exit(1); }

                // Archive everything that is not the real school
                const toArchive = schools.filter(s => s.id !== real.id);
                for (const s of toArchive) {
                  await prisma.school.update({ where: { id: s.id }, data: { archived: true, active: false } });
                  console.log('Archived:', s.name);
                }

                // Ensure the real school is active and locked
                await prisma.school.update({
                  where: { id: real.id },
                  data: { active: true, archived: false, institutionTypeLocked: true, institutionType: 'PRIMARY_CBC' }
                });
                console.log('✅ WASO-COMPREHENSIVE SCHOOL is now the only active school, institution type locked to PRIMARY_CBC');

                await prisma.\\\$disconnect();
              }

              main().catch(e => { console.error(e); process.exit(1); });
            \"
          "
