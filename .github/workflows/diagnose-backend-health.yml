name: Diagnose Backend Health

# Read-only diagnostic: checks a school's backend container uptime, recent
# restarts, resource usage, and recent logs. Never modifies anything.
# Use this after seeing socket.io / API 502s in the browser console to find
# out whether the backend container restarted, crashed, or is under memory
# pressure around a given time.
on:
  workflow_dispatch:
    inputs:
      school_slug:
        description: "School instance id from deploy/instances.manifest.json"
        required: true
        default: "demo"
        type: string
      since:
        description: "How far back to pull logs (docker --since format, e.g. 30m, 2h)"
        required: true
        default: "30m"
        type: string
      log_lines:
        description: "Max number of log lines to print (most recent)"
        required: true
        default: "200"
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    name: Check backend container health
    runs-on: ubuntu-latest
    environment: deploy-production-school
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: Run backend health diagnostics
        env:
          SCHOOL_ID: ${{ inputs.school_slug }}
          SINCE: ${{ inputs.since }}
          LOG_LINES: ${{ inputs.log_lines }}
        run: |
          set -euo pipefail
          ssh production "SCHOOL_ID='${SCHOOL_ID}' SINCE='${SINCE}' LOG_LINES='${LOG_LINES}' bash -s" <<'REMOTE' | tee /tmp/diagnose-output.txt
          set -euo pipefail

          manifest=/srv/zawadi/apps/deploy/instances.manifest.json
          [[ -f "$manifest" ]] || { echo "Manifest not found"; exit 1; }
          instance="$(jq -c --arg id "$SCHOOL_ID" '.instances[] | select(.id == $id)' "$manifest")"
          [[ -n "$instance" ]] || { echo "Unknown school id: $SCHOOL_ID"; exit 1; }

          kind="$(jq -r '.kind' <<<"$instance")"
          project="$(jq -r '.compose_project // empty' <<<"$instance")"
          domain="$(jq -r '.public_domain // "unknown"' <<<"$instance")"

          if [[ "$kind" == "main" ]]; then
            backend=zawadi-backend
          else
            backend="$(sudo docker ps -a --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n1)"
          fi
          [[ -n "$backend" ]] || { echo "Could not find backend container for $SCHOOL_ID"; exit 1; }

          echo "================================================================"
          echo "  BACKEND HEALTH — school: $SCHOOL_ID  (domain: $domain)"
          echo "  container: $backend"
          echo "================================================================"

          echo ""
          echo "## 1. Container status / uptime"
          sudo docker ps -a --filter "name=^${backend}$" --format 'table {{.Names}}\t{{.Status}}\t{{.RunningFor}}'

          echo ""
          echo "## 2. Restart count + exit/OOM history"
          sudo docker inspect "$backend" --format '
          RestartCount: {{.RestartCount}}
          OOMKilled (last exit): {{.State.OOMKilled}}
          Last ExitCode: {{.State.ExitCode}}
          Last FinishedAt: {{.State.FinishedAt}}
          Last StartedAt: {{.State.StartedAt}}'

          echo ""
          echo "## 3. Current resource usage (live snapshot)"
          sudo docker stats --no-stream "$backend" --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.MemPerc}}'

          echo ""
          echo "## 4. Configured memory limit"
          sudo docker inspect "$backend" --format 'Memory limit: {{.HostConfig.Memory}} bytes (0 = unlimited)'

          echo ""
          echo "## 4.5 transport_trips schema (column names and row count only)"
          sudo docker exec -i "$backend" node - <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            const tables = await prisma.$queryRaw`SELECT table_name FROM information_schema.tables WHERE table_schema = 'public' AND table_name = 'transport_trips'`;
            if (!tables[0]?.table_name) {
              console.log('transport_trips table is absent');
              return;
            }
            const columns = await prisma.$queryRaw`SELECT column_name, data_type, is_nullable
              FROM information_schema.columns
              WHERE table_schema = 'public' AND table_name = 'transport_trips'
              ORDER BY ordinal_position`;
            const counts = await prisma.$queryRaw`SELECT COUNT(*)::int AS row_count FROM public.transport_trips`;
            console.log(JSON.stringify({ columns, rowCount: counts[0]?.row_count ?? 0 }, null, 2));
          })().catch((error) => { console.error(error); process.exitCode = 1; })
            .finally(() => prisma.$disconnect());
          NODE

          echo "## 4.6 Driver today query (read-only Prisma reproduction)"
          sudo docker exec -i "$backend" node - <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          const summarize = (error) => ({
            name: error?.name,
            code: error?.code,
            message: error?.message,
            meta: error?.meta,
          });
          (async () => {
            const drivers = await prisma.transportVehicle.findMany({
              where: { archived: false, driverId: { not: null } },
              select: { id: true, driverId: true },
            });
            console.log(`Linked driver vehicles: ${drivers.length}`);
            const date = new Date();
            const dateUtc = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            for (const [index, vehicle] of drivers.entries()) {
              const or = [{ driverUserId: vehicle.driverId }];
              or.push({ driverUserId: null, vehicleId: vehicle.id });
              or.push({ driverUserId: null, route: { vehicleId: vehicle.id } });
              try {
                const trips = await prisma.transportTrip.findMany({
                  where: { archived: false, date: dateUtc, OR: or },
                  include: {
                    route: { include: { vehicle: true } },
                    vehicle: true,
                    _count: { select: { boardingEvents: true } },
                  },
                  orderBy: [{ direction: 'asc' }, { createdAt: 'asc' }],
                });
                console.log(`Vehicle ${index + 1}: trip query succeeded (${trips.length} trips)`);
                for (const trip of trips) {
                  try {
                    const assignments = await prisma.transportAssignment.findMany({
                      where: { routeId: trip.routeId, passengerType: 'LEARNER', archived: false },
                      select: { passengerId: true, pickupPoint: true, dropoffPoint: true },
                    });
                    const learners = await prisma.learner.findMany({
                      where: { id: { in: assignments.map((a) => a.passengerId) }, archived: false },
                      select: {
                        id: true, firstName: true, lastName: true, admissionNumber: true,
                        grade: true, stream: true, primaryContactPhone: true, guardianPhone: true,
                      },
                      orderBy: [{ grade: 'asc' }, { lastName: 'asc' }],
                    });
                    await prisma.transportBoardingEvent.findMany({
                      where: { tripId: trip.id }, orderBy: { recordedAt: 'desc' },
                    });
                    console.log(`  Manifest query succeeded (${learners.length} assigned learners)`);
                  } catch (error) {
                    console.log('  Manifest query failed:', JSON.stringify(summarize(error)));
                  }
                }
              } catch (error) {
                console.log(`Vehicle ${index + 1}: trip query failed:`, JSON.stringify(summarize(error)));
              }
            }
          })().catch((error) => { console.error(JSON.stringify(summarize(error))); process.exitCode = 1; })
            .finally(() => prisma.$disconnect());
          NODE

          echo "## 5. Recent logs (since ${SINCE}, last ${LOG_LINES} lines)"
          sudo docker logs "$backend" --since "$SINCE" --timestamps 2>&1 | tail -n "$LOG_LINES"

          echo ""
          echo "================================================================"
          echo "  END OF REPORT"
          echo "================================================================"
          REMOTE

      - name: Publish to job summary
        if: always()
        run: |
          {
            echo "## Backend health report — \`${{ inputs.school_slug }}\`"
            echo ""
            echo '```'
            cat /tmp/diagnose-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
