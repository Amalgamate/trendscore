name: Force Re-migrate School DB (One-Shot)

# For schools whose _prisma_migrations table is stale/incomplete (fast-baseline
# drift). The repair-schema-drift workflow already applied the SQL; this
# workflow rebuilds the _prisma_migrations history table to match so Prisma
# stops throwing P2022/P3005 errors.
#
# Strategy: clear _prisma_migrations, then mark ALL migrations as applied
# via migrate resolve --applied. This is safe because repair-schema-drift
# already ran all the SQL. We cannot run migrate deploy because older
# migrations lack IF NOT EXISTS and will fail on already-existing columns.

on:
  workflow_dispatch:
    inputs:
      school_slug:
        description: 'School instance id (e.g. goda, mwangaza-cs)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  remigrate:
    name: Force re-migrate ${{ inputs.school_slug }}
    runs-on: ubuntu-latest
    environment: deploy-production-school
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: Rebuild migration history and restart backend
        env:
          SCHOOL_ID: ${{ inputs.school_slug }}
        run: |
          set -euo pipefail
          ssh production "SCHOOL_ID='${SCHOOL_ID}' bash -s" <<'REMOTE'
          set -euo pipefail

          manifest=/srv/zawadi/apps/deploy/instances.manifest.json
          instance="$(jq -c --arg id "$SCHOOL_ID" '.instances[] | select(.id == $id)' "$manifest")"
          [[ -n "$instance" ]] || { echo "Unknown school: $SCHOOL_ID"; exit 1; }

          kind="$(jq -r '.kind' <<<"$instance")"
          project="$(jq -r '.compose_project // empty' <<<"$instance")"
          if [[ "$kind" == "main" ]]; then
            backend=zawadi-backend
          else
            backend="$(sudo docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=backend' --format '{{.Names}}' | head -n1)"
          fi
          [[ -n "$backend" ]] || { echo "Backend container not found for $SCHOOL_ID"; exit 1; }

          echo "=== Target: $SCHOOL_ID / container: $backend ==="

          echo "=== Step 1: Clear _prisma_migrations ==="
          sudo docker exec "$backend" sh -lc \
            'echo "DROP TABLE IF EXISTS _prisma_migrations;" | npx prisma db execute --schema prisma/schema.prisma --stdin && echo "Cleared _prisma_migrations"'

          echo "=== Step 2: Baseline ALL migrations as applied ==="
          # The schema was already repaired by repair-schema-drift.
          # Mark every migration as applied so Prisma state matches reality.
          sudo docker exec "$backend" sh -lc '
            set -e
            cd /app
            count=0
            for dir in $(ls -d prisma/migrations/*/); do
              name=$(basename "$dir")
              [[ -f "${dir}migration.sql" ]] || continue
              npx prisma migrate resolve --applied "$name" 2>&1 | tail -1
              count=$((count + 1))
            done
            echo "Baselined $count migrations."
          '

          echo "=== Step 3: Verify no pending migrations ==="
          sudo docker exec "$backend" sh -lc \
            'cd /app && npx prisma migrate status 2>&1 | grep -E "applied|pending|Database schema|migrations" | head -5'

          echo "=== Step 4: Restart backend ==="
          sudo docker restart "$backend"
          sleep 8

          echo "=== Step 5: Verify critical columns ==="
          sudo docker exec "$backend" sh -lc '
            echo "SELECT table_name, column_name FROM information_schema.columns WHERE table_schema = '"'"'public'"'"' AND (table_name, column_name) IN (('"'"'streams'"'"','"'"'isDefault'"'"'),('"'"'schools'"'"','"'"'reportEngine'"'"'),('"'"'subject_assignments'"'"','"'"'classId'"'"'),('"'"'summative_tests'"'"','"'"'weekNumber'"'"'),('"'"'users'"'"','"'"'verificationRequired'"'"')) ORDER BY 1,2;" | npx prisma db execute --schema prisma/schema.prisma --stdin
          '

          echo "=== Re-migration complete for $SCHOOL_ID ==="
          REMOTE

      - name: Report success
        if: success()
        run: |
          echo "## Re-migration succeeded for \`${{ inputs.school_slug }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "All migrations baselined. Backend restarted." >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: |
          echo "## Re-migration FAILED for \`${{ inputs.school_slug }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Check logs above for the specific error." >> "$GITHUB_STEP_SUMMARY"
