name: Promote Release

# Manual-only school deployment. Operators type a school slug and the workflow
# validates it against deploy/instances.manifest.json before touching servers.

on:
  workflow_dispatch:
    inputs:
      school_slug:
        description: "School slug to deploy, e.g. demo, lions-complex, zawadi-junior"
        required: true
        type: string
      environment:
        description: "Deployment environment, e.g. demo, pilot, production"
        required: true
        type: string
        default: production
      branch:
        description: "Git branch/ref whose sha-<commit> images should be deployed"
        required: true
        type: string
        default: main

concurrency:
  group: promote-release-${{ inputs.environment }}-${{ inputs.school_slug }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      deploy_target: ${{ steps.target.outputs.deploy_target }}
      school_id: ${{ steps.target.outputs.school_id }}
      school_name: ${{ steps.target.outputs.school_name }}
      domain: ${{ steps.target.outputs.domain }}
      compose_project: ${{ steps.target.outputs.compose_project }}
      environment: ${{ steps.target.outputs.environment }}
      github_environment: ${{ steps.target.outputs.github_environment }}
      branch: ${{ steps.target.outputs.branch }}
      image_tag: ${{ steps.image.outputs.image_tag }}
      commit_sha: ${{ steps.image.outputs.commit_sha }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Resolve image tag
        id: image
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved branch '${{ inputs.branch }}' to ${COMMIT_SHA}"

      - name: Validate deployment target
        id: target
        run: |
          set -euo pipefail
          node scripts/validate-deployment-target.js "${{ inputs.school_slug }}" \
            --environment "${{ inputs.environment }}" \
            --branch "${{ inputs.branch }}" \
            --manifest deploy/instances.manifest.json

  promote:
    runs-on: ubuntu-latest
    needs: validate
    environment: ${{ needs.validate.outputs.github_environment }}
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.branch }}
          fetch-depth: 0

      - name: Print matched school details
        run: |
          {
            echo "## Matched school deployment"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| School name | \`${{ needs.validate.outputs.school_name }}\` |"
            echo "| School slug | \`${{ needs.validate.outputs.school_id }}\` |"
            echo "| Domain | \`${{ needs.validate.outputs.domain || 'n/a' }}\` |"
            echo "| Server/container name | \`${{ needs.validate.outputs.compose_project }}\` |"
            echo "| Environment | \`${{ needs.validate.outputs.environment }}\` |"
            echo "| Branch | \`${{ needs.validate.outputs.branch }}\` |"
            echo "| Commit | \`${{ needs.validate.outputs.commit_sha }}\` |"
            echo "| Image tag | \`${{ needs.validate.outputs.image_tag }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "School name          : ${{ needs.validate.outputs.school_name }}"
          echo "Domain               : ${{ needs.validate.outputs.domain || 'n/a' }}"
          echo "Server/container name: ${{ needs.validate.outputs.compose_project }}"
          echo "Environment          : ${{ needs.validate.outputs.environment }}"
          echo "Branch               : ${{ needs.validate.outputs.branch }}"
          echo "Image tag            : ${{ needs.validate.outputs.image_tag }}"

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate container images exist
        run: |
          set -euo pipefail
          for image in ghcr.io/amalgamate/zawadi-frontend ghcr.io/amalgamate/zawadi-backend ghcr.io/amalgamate/zawadi-console; do
            echo "Inspecting ${image}:${{ needs.validate.outputs.image_tag }}"
            docker manifest inspect "${image}:${{ needs.validate.outputs.image_tag }}" >/dev/null
          done

      - name: Upload deploy assets
        run: bash scripts/ci/sync-deploy-assets.sh

      - name: Confirm production SSH connectivity
        run: bash scripts/ci/wait-for-production-ssh.sh

      - name: Deploy matched school only
        env:
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          DEPLOY_TARGET: ${{ needs.validate.outputs.deploy_target }}
          SCHOOL_ID: ${{ needs.validate.outputs.school_id }}
        run: |
          set -euo pipefail
          DEPLOY_CMD="DEPLOY_TARGET=${DEPLOY_TARGET} IMAGE_TAG=${IMAGE_TAG} MANIFEST_PATH=/srv/zawadi/apps/deploy/instances.manifest.json"
          if [[ "${DEPLOY_TARGET}" == "all_schools" || "${DEPLOY_TARGET}" == "pilot" ]]; then
            echo "Batch deploy: ${DEPLOY_TARGET}"
            ssh production "${DEPLOY_CMD} bash /srv/zawadi/apps/deploy/deploy-release.sh"
          else
            echo "Single school deploy: ${SCHOOL_ID}"
            ssh production "${DEPLOY_CMD} SCHOOL_ID=${SCHOOL_ID} bash /srv/zawadi/apps/deploy/deploy-release.sh"
          fi

      - name: Report success
        if: success()
        run: |
          {
            echo "## Deployment succeeded"
            echo ""
            echo "Deployed \`${{ needs.validate.outputs.deploy_target }}\` target with tag \`${{ needs.validate.outputs.image_tag }}\`."
            echo ""
            echo "Per-instance pipeline: verify target → DB backup → pull image → migrate → restart → health check."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: |
          {
            echo "## Deployment failed"
            echo ""
            echo "Deployment stopped or failed for \`${{ needs.validate.outputs.school_id }}\`."
            echo "If validation failed, no server deployment was started."
            echo "If server deployment started, check backups under \`/srv/zawadi/backups\` before retrying."
          } >> "$GITHUB_STEP_SUMMARY"
