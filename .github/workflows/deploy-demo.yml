name: Deploy Demo

# Manual-only canary deployment. For production schools, use Promote Release
# and type the target school_slug.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Git branch/ref whose sha-<commit> images should be deployed"
        required: true
        type: string
        default: main

concurrency:
  group: deploy-demo-${{ inputs.branch }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    environment: deploy-demo
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Resolve image tag
        id: image
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Resolved branch '${{ inputs.branch }}' to ${COMMIT_SHA}"

      - name: Validate demo target
        id: target
        run: |
          set -euo pipefail
          node scripts/validate-deployment-target.js demo \
            --environment demo \
            --branch "${{ inputs.branch }}" \
            --manifest deploy/instances.manifest.json

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: Upload deploy assets
        run: bash scripts/ci/sync-deploy-assets.sh

      - name: Deploy demo instance
        env:
          IMAGE_TAG: ${{ steps.image.outputs.image_tag }}
          SCHOOL_ID: ${{ steps.target.outputs.school_id }}
        run: |
          set -euo pipefail
          ssh production \
            "DEPLOY_TARGET=school SCHOOL_ID=${SCHOOL_ID} IMAGE_TAG=${IMAGE_TAG} MANIFEST_PATH=/srv/zawadi/apps/deploy/instances.manifest.json bash /srv/zawadi/apps/deploy/deploy-release.sh"

      - name: Report success
        if: success()
        run: |
          {
            echo "## Demo deploy succeeded"
            echo ""
            echo "- School: \`${{ steps.target.outputs.school_name }}\`"
            echo "- Domain: \`${{ steps.target.outputs.domain }}\`"
            echo "- Container: \`${{ steps.target.outputs.compose_project }}\`"
            echo "- Branch: \`${{ inputs.branch }}\`"
            echo "- Image tag: \`${{ steps.image.outputs.image_tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report failure
        if: failure()
        run: |
          {
            echo "## Demo deploy failed"
            echo ""
            echo "If validation failed, no server deployment was started."
            echo "If server deployment started, check the job log and server backups before retrying."
          } >> "$GITHUB_STEP_SUMMARY"
