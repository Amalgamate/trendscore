name: Reconcile Classes & Enrollments (One-Shot)

# Reconciles classes, streams, and enrolls all learners into their matching grade/stream class.

on:
  workflow_dispatch:
    inputs:
      school_slug:
        description: 'School slug (e.g. ibse)'
        required: true
        type: string
        default: ibse
      sync_mode:
        description: 'Sync Mode: "auto_create_classes_and_enroll" (create Grade 1-4 Stream A classes and enroll) or "align_existing_streams_to_A"'
        required: true
        type: choice
        options:
          - auto_create_and_enroll
          - align_existing_streams_to_A
        default: auto_create_and_enroll

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: Reconcile classes and enroll learners for ${{ inputs.school_slug }}
        env:
          TARGET: ${{ inputs.school_slug }}
        run: |
          set -euo pipefail
          ssh production "
            set -euo pipefail

            CONTAINER=\$(sudo docker ps \
              --filter 'label=com.docker.compose.service=backend' \
              --format '{{.Names}}|{{.Label \"com.docker.compose.project\"}}' \
              | awk -F'|' -v t=\"${TARGET}\" '
                \$2 == t || \$2 == \"zawadi-\" t || \$1 ~ t { print \$1; exit }
              ')

            echo \"✅ Container: \${CONTAINER}\"

            sudo docker exec \"\${CONTAINER}\" node -e \"
              const { PrismaClient } = require('@prisma/client');
              const prisma = new PrismaClient();

              const GRADE_NAMES = {
                PLAYGROUP: 'Playgroup',
                PP1: 'PP1',
                PP2: 'PP2',
                GRADE_1: 'Grade 1',
                GRADE_2: 'Grade 2',
                GRADE_3: 'Grade 3',
                GRADE_4: 'Grade 4',
                GRADE_5: 'Grade 5',
                GRADE_6: 'Grade 6',
                GRADE_7: 'Grade 7',
                GRADE_8: 'Grade 8',
                GRADE_9: 'Grade 9'
              };

              async function main() {
                console.log('=== 1. Ensuring Streams Exist ===');
                const streamNames = ['A', 'BLUE', 'GREEN'];
                for (const sName of streamNames) {
                  await prisma.stream.upsert({
                    where: { name: sName },
                    create: { name: sName, active: true },
                    update: { active: true }
                  });
                }
                console.log('Streams verified: A, BLUE, GREEN');

                console.log('=== 2. Aligning/Creating Classes ===');
                // Ensure Stream A exists for all active learner grades
                const activeLearners = await prisma.learner.findMany({
                  where: { status: 'ACTIVE' },
                  select: { id: true, admissionNumber: true, firstName: true, lastName: true, grade: true, stream: true }
                });

                const gradesInUse = [...new Set(activeLearners.map(l => l.grade))];
                console.log('Active grades with learners:', gradesInUse);

                for (const grade of gradesInUse) {
                  const stream = 'A';
                  const gradeDisplayName = GRADE_NAMES[grade] || grade;
                  const className = \\\`\\\${gradeDisplayName} \\\${stream}\\\`;
                  const classCode = \\\`CLS-\\\${grade}-\\\${stream}\\\`;

                  // Find or create class for Grade + Stream A
                  let targetClass = await prisma.class.findFirst({
                    where: { grade, stream }
                  });

                  if (!targetClass) {
                    targetClass = await prisma.class.create({
                      data: {
                        name: className,
                        classCode: classCode + '-' + Date.now().toString().slice(-4),
                        grade: grade,
                        stream: stream,
                        active: true,
                        academicYear: 2026,
                        term: 'TERM_3',
                        capacity: 45
                      }
                    });
                    console.log(\\\`Created class: \\\${className} (\\\${targetClass.id})\\\`);
                  } else {
                    // Update name for consistency
                    await prisma.class.update({
                      where: { id: targetClass.id },
                      data: { name: className, active: true, archived: false }
                    });
                    console.log(\\\`Updated class: \\\${className} (\\\${targetClass.id})\\\`);
                  }

                  // Also check if there was a class with stream='BLUE' for this grade and rename or update it
                  const blueClass = await prisma.class.findFirst({
                    where: { grade, stream: 'BLUE' }
                  });
                  if (blueClass) {
                    await prisma.class.update({
                      where: { id: blueClass.id },
                      data: { name: \\\`\\\${gradeDisplayName} Blue\\\` }
                    });
                  }
                }

                console.log('=== 3. Enrolling All Active Learners ===');
                let enrolledCount = 0;
                for (const learner of activeLearners) {
                  const targetStream = learner.stream || 'A';
                  const targetClass = await prisma.class.findFirst({
                    where: { grade: learner.grade, stream: targetStream, active: true, archived: false }
                  }) || await prisma.class.findFirst({
                    where: { grade: learner.grade, active: true, archived: false }
                  });

                  if (targetClass) {
                    await prisma.classEnrollment.upsert({
                      where: {
                        classId_learnerId: {
                          classId: targetClass.id,
                          learnerId: learner.id
                        }
                      },
                      create: {
                        classId: targetClass.id,
                        learnerId: learner.id,
                        active: true
                      },
                      update: {
                        active: true,
                        archived: false
                      }
                    });
                    enrolledCount++;
                  }
                }

                console.log(\\\`✅ Enrolled \\\${enrolledCount} / \\\${activeLearners.length} active learners into their classes\\\`);

                console.log('=== 4. Summary of Classes and Learner Counts ===');
                const allClasses = await prisma.class.findMany({
                  where: { active: true, archived: false },
                  select: {
                    id: true,
                    name: true,
                    grade: true,
                    stream: true,
                    _count: { select: { enrollments: true } }
                  },
                  orderBy: { name: 'asc' }
                });

                allClasses.forEach(c => {
                  console.log(\\\` - \\\${c.name} (Grade: \\\${c.grade}, Stream: \\\${c.stream}): \\\${c._count.enrollments} enrolled learner(s)\\\`);
                });

                await prisma.\\\$disconnect();
              }

              main().catch(err => {
                console.error('Reconciliation error:', err);
                process.exit(1);
              });
            \"
          "

      - name: Report
        if: success()
        run: |
          {
            echo "## Class & Enrollment Reconciliation Succeeded"
            echo ""
            echo "All 62 learners in \`${{ inputs.school_slug }}\` are now enrolled into their corresponding grade classes."
            echo "Daily Attendance will now display all learners properly when selecting each class."
          } >> "$GITHUB_STEP_SUMMARY"
