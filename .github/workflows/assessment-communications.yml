name: Assessment Communications Quality Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/src/controllers/notification.controller.ts'
      - 'server/src/routes/notification.routes.ts'
      - 'server/src/services/assessment-sms-delivery.service.ts'
      - 'server/src/__tests__/assessmentSmsDelivery.service.spec.ts'
      - 'src/components/CBCGrading/pages/SummativeReport.jsx'
      - 'src/components/CBCGrading/pages/MessageHistoryPage.jsx'
      - 'src/services/api/notification.api.js'
      - '.github/workflows/assessment-communications.yml'
  push:
    branches: [main]
    paths:
      - 'server/src/controllers/notification.controller.ts'
      - 'server/src/routes/notification.routes.ts'
      - 'server/src/services/assessment-sms-delivery.service.ts'
      - 'server/src/__tests__/assessmentSmsDelivery.service.spec.ts'
      - 'src/components/CBCGrading/pages/SummativeReport.jsx'
      - 'src/components/CBCGrading/pages/MessageHistoryPage.jsx'
      - 'src/services/api/notification.api.js'
      - '.github/workflows/assessment-communications.yml'

concurrency:
  group: assessment-communications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Durable delivery audit and UI contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/trendscore_assessment_sms_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/trendscore_assessment_sms_ci?schema=public
      JWT_SECRET: ci_dummy_jwt_secret_minimum_32_chars________
      JWT_REFRESH_SECRET: ci_dummy_refresh_secret_minimum_32_chars_
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Typecheck server
        working-directory: server
        run: npx tsc --noEmit --pretty false

      - name: Run assessment SMS delivery regression tests
        working-directory: server
        run: npx jest src/__tests__/assessmentSmsDelivery.service.spec.ts --runInBand --coverage=false

      - name: Lint assessment communications UI contract
        run: >-
          npx eslint
          src/components/CBCGrading/pages/SummativeReport.jsx
          src/components/CBCGrading/pages/MessageHistoryPage.jsx
          src/services/api/notification.api.js

      - name: Build production frontend
        run: npm run build
