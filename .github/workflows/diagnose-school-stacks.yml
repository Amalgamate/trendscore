name: Diagnose School Stacks (One-Shot)

# Lists all running compose stacks, their ports, env files, and any
# stack named "goda". Safe — read-only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: List all stacks, ports and env files
        run: |
          ssh production '
            set -euo pipefail
            echo "=== All running containers (project | service | image | ports) ==="
            sudo docker ps --format "table {{.Label \"com.docker.compose.project\"}}\t{{.Label \"com.docker.compose.service\"}}\t{{.Image}}\t{{.Ports}}" | sort

            echo ""
            echo "=== Docker image inventory (CONTAINERS=0 means no container references the image) ==="
            sudo docker system df -v

            echo ""
            echo "=== All containers (including stopped; image IDs and references) ==="
            sudo docker ps -a --no-trunc --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.ID}}"

            echo ""
            echo "=== Trevor's Academy PostgreSQL startup log ==="
            sudo docker logs --tail 80 zawadi-trevorsacaemy-db-1 2>&1 || true

            echo ""
            echo "=== Trevor's Academy databases ==="
            sudo docker exec zawadi-trevorsacaemy-db-1 \
              psql -U zawadi -d postgres -Atc "SELECT datname FROM pg_database ORDER BY datname" 2>&1 || true

            echo ""
            echo "=== Trevor's Academy Prisma migration table ==="
            sudo docker exec zawadi-trevorsacaemy-db-1 \
              psql -U zawadi -d zawadi_trevorsacaemy -Atc \
              "SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='_prisma_migrations' ORDER BY ordinal_position" 2>&1 || true

            echo ""
            echo "=== Trevor's Academy migration state query ==="
            sudo docker exec zawadi-trevorsacaemy-db-1 \
              psql -U zawadi -d zawadi_trevorsacaemy -tAc \
              "SELECT CASE WHEN to_regclass('public._prisma_migrations') IS NULL THEN 'fresh' WHEN EXISTS (SELECT 1 FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL) THEN 'failed' ELSE 'ready' END" 2>&1 || true

            echo ""
            echo "=== All env files in /srv/zawadi/apps/env/ ==="
            ls -la /srv/zawadi/apps/env/ 2>/dev/null || echo "(dir missing)"

            echo ""
            echo "=== Root-level env files in /srv/zawadi/apps/ ==="
            ls -la /srv/zawadi/apps/.env.* 2>/dev/null || echo "(none)"

            echo ""
            echo "=== Goda-related containers (any) ==="
            sudo docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -i "goda" || echo "(none found)"

            echo ""
            echo "=== Goda-related volumes ==="
            sudo docker volume ls | grep -i "goda" || echo "(none found)"

            echo ""
            echo "=== All used host ports ==="
            sudo docker ps --format "{{.Ports}}" | grep -oE "[0-9]+->5000|[0-9]+->3000" | sort -t: -k1 -n || echo "(none)"

            echo ""
            echo "=== Compose projects with stack compose file ==="
            sudo docker ps \
              --filter "label=com.docker.compose.service=frontend" \
              --format "{{.Label \"com.docker.compose.project\"}}|{{.Label \"com.docker.compose.project.environment_file\"}}" \
              | sort
          '

      - name: Query Trevor migration state without changing data
        run: |
          ssh production 'bash -s' <<'REMOTE'
          set -euo pipefail
          sudo docker exec zawadi-trevorsacaemy-db-1 psql \
            -U zawadi -d zawadi_trevorsacaemy -tAc \
            "SELECT CASE WHEN to_regclass('public._prisma_migrations') IS NULL THEN 'fresh' WHEN EXISTS (SELECT 1 FROM _prisma_migrations WHERE finished_at IS NULL AND rolled_back_at IS NULL) THEN 'failed' ELSE 'ready' END"
          REMOTE
