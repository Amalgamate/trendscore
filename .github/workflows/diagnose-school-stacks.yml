name: Diagnose School Stacks (One-Shot)

# Lists all running compose stacks, their ports, env files, and any
# stack named "goda". Safe — read-only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: List all stacks, ports and env files
        run: |
          ssh production '
            set -euo pipefail
            manifest=/srv/zawadi/apps/deploy/instances.manifest.json
            [[ -f "$manifest" ]] || { echo "Manifest not found: $manifest"; exit 1; }

            echo "=== Running containers (project | service | image | ports) ==="
            sudo docker ps --format "{{.Label \"com.docker.compose.project\"}}|{{.Label \"com.docker.compose.service\"}}|{{.Image}}|{{.Ports}}" | sort

            echo ""
            echo "=== Active production schools from manifest ==="
            jq -r '.instances[] | select(.active == true and .tier == "production") | [.id, .label, .kind, (.compose_project // "-"), (.public_domain // "-")] | @tsv' "$manifest" \
              | while IFS="$(printf '\t')" read -r id label kind project domain; do
                  if [[ "$kind" == "main" ]]; then
                    backend=zawadi-backend
                    db=zawadi-db
                  else
                    backend="$(sudo docker ps --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=backend" --format "{{.Names}}" | head -n1)"
                    db="$(sudo docker ps --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=db" --format "{{.Names}}" | head -n1)"
                  fi
                  frontend="$(sudo docker ps --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=frontend" --format "{{.Names}}" | head -n1)"
                  [[ -n "$backend" ]] || backend="MISSING"
                  [[ -n "$db" ]] || db="MISSING"
                  [[ -n "$frontend" ]] || frontend="MISSING"
                  printf "school=%s | label=%s | domain=%s | project=%s | backend=%s | db=%s | frontend=%s\n" "$id" "$label" "$domain" "$project" "$backend" "$db" "$frontend"
                done

            echo ""
            echo "=== Manifest production school IDs (explicit check includes Goda) ==="
            jq -r '.instances[] | select(.active == true and .tier == "production") | .id' "$manifest" | sort

            echo ""
            echo "=== Goda volumes ==="
            sudo docker volume ls --filter "name=zawadi-goda" --format "{{.Name}}" || true
          '
