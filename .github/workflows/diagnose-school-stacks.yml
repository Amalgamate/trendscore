name: Diagnose School Stacks (One-Shot)

# Lists all running compose stacks, their ports, env files, and any
# stack named "goda". Safe — read-only.

on:
  workflow_dispatch:
    inputs:
      create_affected_backups:
        description: 'Create and verify fresh backups for the five databases flagged in the rollout'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: Create and verify fresh backups for affected schools
        if: inputs.create_affected_backups
        run: |
          set -euo pipefail
          ssh production 'bash -s' <<'REMOTE'
          set -euo pipefail
          manifest=/srv/zawadi/apps/deploy/instances.manifest.json
          backup_root=/srv/zawadi/backups
          schools=(malkagalla gamachu-school memu-school trevorsacaemy demo)

          for id in "${schools[@]}"; do
            instance="$(jq -c --arg id "$id" '.instances[] | select(.id == $id or (.aliases // [] | index($id)))' "$manifest")"
            [[ -n "$instance" ]] || { echo "Unknown school in manifest: $id" >&2; exit 1; }
            project="$(jq -r '.compose_project // empty' <<<"$instance")"
            [[ -n "$project" ]] || { echo "No compose project for $id" >&2; exit 1; }
            db="$(sudo docker ps --filter "label=com.docker.compose.project=$project" --filter 'label=com.docker.compose.service=db' --format '{{.Names}}' | head -n1)"
            [[ -n "$db" ]] || { echo "DB container is not running for $id ($project)" >&2; exit 1; }
            db_user="$(sudo docker exec "$db" printenv POSTGRES_USER)"
            db_name="$(sudo docker exec "$db" printenv POSTGRES_DB)"
            [[ -n "$db_user" && -n "$db_name" ]] || { echo "Database credentials missing in container $db" >&2; exit 1; }

            stamp="$(date -u +%Y%m%dT%H%M%SZ)"
            dir="$backup_root/$id/$stamp"
            sudo mkdir -p "$dir"
            tmp="$dir/database.sql.tmp"
            dest="$dir/database.sql"
            echo "Backing up $id using configured database role/name ($db_user / $db_name)"
            sudo docker exec "$db" pg_dump -U "$db_user" "$db_name" | sudo tee "$tmp" >/dev/null
            sudo test -s "$tmp"
            sudo grep -q '^-- PostgreSQL database dump' "$tmp"
            sudo mv "$tmp" "$dest"
            echo "$dest" | sudo tee "$dir/LATEST" >/dev/null
            sudo sha256sum "$dest"
            sudo wc -c "$dest"
            echo "Verified backup: $id"
          done
          REMOTE

      - name: List all stacks, ports and env files
        run: |
          ssh production "bash -s" <<'REMOTE'
            set -euo pipefail
            manifest=/srv/zawadi/apps/deploy/instances.manifest.json
            [[ -f "$manifest" ]] || { echo "Manifest not found: $manifest"; exit 1; }

            echo "=== Running containers (project | service | image | ports) ==="
            sudo docker ps --format '{{.Label "com.docker.compose.project"}}|{{.Label "com.docker.compose.service"}}|{{.Image}}|{{.Ports}}' | sort

            echo ""
            echo "=== Active production schools from manifest ==="
            jq -r '.instances[] | select(.active == true and .tier == "production") | [.id, .label, .kind, (.compose_project // "-"), (.public_domain // "-")] | @tsv' "$manifest" \
              | while IFS="$(printf '\t')" read -r id label kind project domain; do
                  if [[ "$kind" == "main" ]]; then
                    backend=zawadi-backend
                    db=zawadi-db
                  else
                    backend="$(sudo docker ps --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=backend" --format "{{.Names}}" | head -n1)"
                    db="$(sudo docker ps --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=db" --format "{{.Names}}" | head -n1)"
                  fi
                  frontend="$(sudo docker ps --filter "label=com.docker.compose.project=$project" --filter "label=com.docker.compose.service=frontend" --format "{{.Names}}" | head -n1)"
                  [[ -n "$backend" ]] || backend="MISSING"
                  [[ -n "$db" ]] || db="MISSING"
                  [[ -n "$frontend" ]] || frontend="MISSING"
                  printf "school=%s | label=%s | domain=%s | project=%s | backend=%s | db=%s | frontend=%s\n" "$id" "$label" "$domain" "$project" "$backend" "$db" "$frontend"
                done

            echo ""
            echo "=== Manifest production school IDs (explicit check includes Goda) ==="
            jq -r '.instances[] | select(.active == true and .tier == "production") | .id' "$manifest" | sort

            echo ""
            echo "=== Goda volumes ==="
            sudo docker volume ls --filter "name=zawadi-goda" --format "{{.Name}}" || true
          REMOTE
