name: Diagnose School Stacks (One-Shot)

# Lists all running compose stacks, their ports, env files, and any
# stack named "goda". Safe — read-only.

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DELETE_ODOO_DATA to remove Odoo production resources"
        required: false
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: List all stacks, ports and env files
        run: |
          ssh production '
            set -euo pipefail
            echo "=== All running containers (project | service | image | ports) ==="
            sudo docker ps --format "table {{.Label \"com.docker.compose.project\"}}\t{{.Label \"com.docker.compose.service\"}}\t{{.Image}}\t{{.Ports}}" | sort

            echo ""
            echo "=== Docker image inventory (CONTAINERS=0 means no container references the image) ==="
            sudo docker system df -v

            echo ""
            echo "=== All containers (including stopped; image IDs and references) ==="
            sudo docker ps -a --no-trunc --format "table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.ID}}"

            echo ""
            echo "=== Trevor's Academy PostgreSQL startup log ==="
            sudo docker logs --tail 80 zawadi-trevorsacaemy-db-1 2>&1 || true

            echo ""
            echo "=== Trevor's Academy databases ==="
            sudo docker exec zawadi-trevorsacaemy-db-1 \
              psql -U zawadi -d postgres -Atc "SELECT datname FROM pg_database ORDER BY datname" 2>&1 || true

            echo ""
            echo "=== All env files in /srv/zawadi/apps/env/ ==="
            ls -la /srv/zawadi/apps/env/ 2>/dev/null || echo "(dir missing)"

            echo ""
            echo "=== Root-level env files in /srv/zawadi/apps/ ==="
            ls -la /srv/zawadi/apps/.env.* 2>/dev/null || echo "(none)"

            echo ""
            echo "=== Goda-related containers (any) ==="
            sudo docker ps -a --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep -i "goda" || echo "(none found)"

            echo ""
            echo "=== Goda-related volumes ==="
            sudo docker volume ls | grep -i "goda" || echo "(none found)"

            echo ""
            echo "=== All used host ports ==="
            sudo docker ps --format "{{.Ports}}" | grep -oE "[0-9]+->5000|[0-9]+->3000" | sort -t: -k1 -n || echo "(none)"

            echo ""
            echo "=== Compose projects with stack compose file ==="
            sudo docker ps \
              --filter "label=com.docker.compose.service=frontend" \
              --format "{{.Label \"com.docker.compose.project\"}}|{{.Label \"com.docker.compose.project.environment_file\"}}" \
              | sort
          '

  remove-odoo-resources:
    if: ${{ inputs.confirmation == 'DELETE_ODOO_DATA' }}
    needs: diagnose
    runs-on: ubuntu-latest
    environment: deploy-production-school
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: bash scripts/ci/configure-deploy-ssh.sh

      - name: Remove Odoo containers, images, networks, and volumes
        run: |
          ssh production 'sudo bash -s' <<'REMOTE'
          set -euo pipefail

          echo "## Disk before Odoo cleanup"
          df -h /

          mapfile -t volumes < <(docker volume ls --format '{{.Name}}' | grep -i 'odoo' || true)
          mapfile -t containers < <(
            for cid in $(docker ps -aq); do
              details=$(docker inspect -f '{{.Name}}|{{.Config.Image}}|{{index .Config.Labels "com.docker.compose.project"}}|{{range .Mounts}}{{.Name}} {{end}}' "$cid")
              if printf '%s' "$details" | grep -qi 'odoo'; then
                printf '%s\n' "$cid"
              fi
            done | sort -u
          )
          mapfile -t networks < <(
            for nid in $(docker network ls -q); do
              details=$(docker network inspect -f '{{.Name}}|{{index .Labels "com.docker.compose.project"}}' "$nid")
              if printf '%s' "$details" | grep -qi 'odoo'; then
                printf '%s\n' "$nid"
              fi
            done | sort -u
          )
          mapfile -t images < <(
            docker image ls --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
              | awk 'tolower($1) ~ /odoo/ {print $2}' | sort -u
          )

          echo "## Odoo containers to remove: ${#containers[@]}"
          for cid in "${containers[@]}"; do
            docker inspect -f '{{.Name}} | {{.Config.Image}}' "$cid"
          done
          echo "## Odoo volumes to remove: ${#volumes[@]}"
          for volume in "${volumes[@]}"; do
            docker volume inspect -f '{{.Name}} | {{.Mountpoint}}' "$volume"
          done
          echo "## Odoo images to remove: ${#images[@]}"
          printf '%s\n' "${images[@]}"
          echo "## Odoo networks to remove: ${#networks[@]}"
          for nid in "${networks[@]}"; do
            docker network inspect -f '{{.Name}}' "$nid"
          done

          if ((${#containers[@]})); then docker rm -f "${containers[@]}"; fi
          if ((${#volumes[@]})); then docker volume rm "${volumes[@]}"; fi
          if ((${#networks[@]})); then
            for nid in "${networks[@]}"; do docker network rm "$nid" || true; done
          fi
          if ((${#images[@]})); then docker image rm "${images[@]}" || true; fi

          echo "## Disk after Odoo cleanup"
          df -h /
          echo "## Remaining Odoo-named Docker resources"
          docker ps -a --format '{{.Names}} {{.Image}}' | grep -i odoo || true
          docker volume ls --format '{{.Name}}' | grep -i odoo || true
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -i odoo || true
          REMOTE
