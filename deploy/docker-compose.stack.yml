version: "3.8"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      DIRECT_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY:?Set BIOMETRIC_ENCRYPTION_KEY in the school env file}
      BIOMETRIC_KEY_VERSION: ${BIOMETRIC_KEY_VERSION:-1}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REKOGNITION_LIVENESS_ROLE_ARN: ${AWS_REKOGNITION_LIVENESS_ROLE_ARN:-}
      AWS_REKOGNITION_COLLECTION_PREFIX: ${AWS_REKOGNITION_COLLECTION_PREFIX:-trendscore}
      AWS_REKOGNITION_LIVENESS_THRESHOLD: ${AWS_REKOGNITION_LIVENESS_THRESHOLD:-90}
      AWS_REKOGNITION_MATCH_THRESHOLD: ${AWS_REKOGNITION_MATCH_THRESHOLD:-97}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Set SUPER_ADMIN_EMAIL in the school env file}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Set SUPER_ADMIN_PASSWORD in the school env file — do not use a shared/guessable default}
      SCHOOL_NAME: ${SCHOOL_NAME:-}
      SCHOOL_INSTITUTION_TYPE: ${SCHOOL_INSTITUTION_TYPE:-PRIMARY_CBC}
      CREATE_EXTRA_DEMO_USERS: ${CREATE_EXTRA_DEMO_USERS:-false}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD in the school env file if CREATE_EXTRA_DEMO_USERS is true — do not use a shared/guessable default}
      FRONTEND_URL: ${FRONTEND_URL}
      API_URL: ${API_URL}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CLOUDINARY_URL: ${CLOUDINARY_URL:-}
      ENABLE_DEV_ROUTES: "false"
      RATE_LIMIT_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Baileys session storage. Must be a volume — /app is rebuilt from the image
      # on every deploy, so a Paired session would otherwise be lost each release.
      WHATSAPP_AUTH_DIR: /app/whatsapp-auth
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      OLLAMA_INTENT_TIMEOUT_MS: ${OLLAMA_INTENT_TIMEOUT_MS:-1800}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      SECURE_COOKIES: "true"
      HTTPS_ONLY: ${HTTPS_ONLY:-false}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
    ports:
      - "${BACKEND_PORT}:5000"
    volumes:
      - whatsapp_auth:/app/whatsapp-auth
    networks:
      - app_net
      # Shared network with the standalone Ollama host (docker-compose.ai.yml).
      # Declared external so a school without a local AI container still starts:
      # Docker only errors here if the network is missing *and* nothing else
      # references it, so the deploy script creates it when absent.
      - ai_net

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - app_net

  # Optional per-school Ollama sidecar; enable only where local inference is desired.
  # Set OLLAMA_BASE_URL=http://ollama:11434 in the school env and start with --profile ai.
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
  ai_net:
    external: true
    name: ${AI_NETWORK:-trendscore-ai}

volumes:
  db_data:
  redis_data:
  ollama_data:
  whatsapp_auth:
